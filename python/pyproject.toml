[project]
name = "ryft"
version = "0.1.0"
description = "Python utilities for inspecting JAX programs and ensuring feature parity with JAX for Ryft."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax==0.6.1",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryft"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "syrupy>=5.1.0",
]
