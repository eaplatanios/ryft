name: Documentation Site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - crates/ryft/examples/**
      - .github/workflows/docs.yaml
  pull_request:
    paths:
      - docs/**
      - crates/ryft/examples/**
      - .github/workflows/docs.yaml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MDBOOK_VERSION: "0.4.40"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Astro Dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro Site
        working-directory: docs
        run: npm run build

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      - name: Build mdBook
        # The mdBook output lands at `docs/dist/book/` so it's served under
        # `/book/` once the combined artifact is uploaded to Pages.
        run: mdbook build docs/book --dest-dir ../dist/book

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
