[book]
authors = ["Anthony Platanios"]
language = "en"
title = "The Ryft Book"
description = "User guide for ryft — installation, feature flags, concepts, and crate reference."
src = "src"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/eaplatanios/ryft"
edit-url-template = "https://github.com/eaplatanios/ryft/edit/main/docs/book/{path}"
# The book is deployed under /book/ on ryft.dev (alongside the Astro site at /).
site-url = "/book/"

[output.html.fold]
enable = true
level = 1
