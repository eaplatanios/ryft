[package]
name = "ryft-optimizers"
version = "0.0.1"
readme = "README.md"
description = "Composable gradient-based optimizers for Ryft."
keywords = ["ryft", "optimizers", "adam", "training", "machine-learning"]
include = [
    "src/**/*",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "../../NOTICE",
]

authors.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}", min = 1 },
    { file = "CHANGELOG.md", search = "Release Date", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## [Unreleased] - Release Date\n", exactly = 1 },
]

[dependencies]
ryft-core.workspace = true
ryft-macros.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[features]
default = []
