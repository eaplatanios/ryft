[package]
name = "ryft-core"
version = "0.0.3"
readme = "README.md"
description = "Core abstractions of the Ryft library."
keywords = ["ryft", "tracing", "autodiff", "compiler", "machine-learning"]
include = [
    "src/**/*",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "../../NOTICE",
]

authors.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}", min = 1 },
    { file = "CHANGELOG.md", search = "Release Date", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## [Unreleased] - Release Date\n", exactly = 1 },
]

[dependencies]
ryft-macros.workspace = true
aquamarine.workspace = true
convert_case.workspace = true
dyn-eq.workspace = true
dyn-hash.workspace = true
flate2.workspace = true
half.workspace = true
num-complex.workspace = true
lru.workspace = true
paste.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Self-referential dev-dependency that enables the `test-utilities` feature for this crate's own doctests, which link
# against the externally built library and therefore do not see `cfg(test)`.
ryft-core = { path = ".", features = ["test-utilities"] }
indoc.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[features]
default = []
benchmarking = []
test-utilities = []
