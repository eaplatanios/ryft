[package]
name = "ryft-models"
version = "0.0.1"
readme = "README.md"
description = "Model definitions, checkpoint importers, tokenizers, and renderers for Ryft."
keywords = ["ryft", "models", "checkpoints", "tokenizers", "machine-learning"]
include = [
    "src/**/*",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "../../NOTICE",
]

authors.workspace = true
edition.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}", min = 1 },
    { file = "CHANGELOG.md", search = "Release Date", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## [Unreleased] - Release Date\n", exactly = 1 },
]

[dependencies]
ryft-checkpoints.workspace = true
ryft-core.workspace = true
ryft-macros.workspace = true
fancy-regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[features]
default = ["safetensors"]
safetensors = ["ryft-checkpoints/safetensors"]

[[example]]
name = "inkling2_import"
required-features = ["safetensors"]
